<div class="flex space-x-4 mt-5">
  <div class="w-80">
    <ul>
      <li>
        <a routerLink="/">All</a>  <!-- si el usuario quiere volver a renderizar la pagina no aparesca ningun queryparam -->
      </li>
      @for (category of categories(); track category) {
        <li>
          <a routerLink="/" [queryParams]="{category_id: category.id}">{{ category.name }}</a>   <!-- filtrar categorias y poner query a las categorias por id -->
        </li>
      }
    </ul>
  </div>
  <div class="grid grid-cols-4 gap-8 w-full">
    @for (product of products(); track $index) {
      <app-product
        [product]="product"
        (addToCart)="addToCart($event)"
        />
    }
  </div>
</div>
